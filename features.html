<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acme Analytics — Features</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white">
  <nav class="border-b border-slate-800 px-8 py-5">
    <div class="max-w-6xl mx-auto flex gap-6">
      <a href="index.html">Home</a>
      <a href="features.html">Features</a>
      <a href="pricing.html">Pricing</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-8 py-20">
    <h1 class="text-4xl font-bold mb-12">Features</h1>

    <div id="features" class="grid md:grid-cols-2 gap-8"></div>
  </main>

  <script>
    const features = [
      {
        name: "Competitor Monitoring",
        description: "Track changes across competitor websites automatically."
      },
      {
        name: "Pricing Tracking",
        description: "Monitor competitor pricing and detect changes."
      },
      {
        name: "Product Monitoring",
        description: "Track product launches, updates and positioning."
      },
      {
        name: "Market Intelligence",
        description: "Turn competitive changes into actionable intelligence."
      }
    ];

    document.getElementById("features").innerHTML =
      features.map(feature => `
        <div class="border border-slate-700 rounded-xl p-8">
          <h2 class="text-2xl font-semibold">${feature.name}</h2>
          <p class="text-slate-400 mt-4">${feature.description}</p>
        </div>
      `).join("");
  </script>
</body>
</html>

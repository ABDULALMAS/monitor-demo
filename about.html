<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-slate-950 text-white">
  <nav class="border-b border-slate-800 px-8 py-5">

    const company = {
      founded: "2024",
      headquarters: "New York",
      description:
        "Acme Analytics helps companies track competitor pricing, products and messaging."
    };

    document.getElementById("company-info").innerHTML = `
      <p class="text-xl text-slate-300">${company.description}</p>

      <div class="border border-slate-700 rounded-xl p-8">
        <p><strong>Founded:</strong> ${company.founded}</p>
        <p class="mt-4"><strong>Headquarters:</strong> ${company.headquarters}</p>
      </div>
    `;
  </script>
